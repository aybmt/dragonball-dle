<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dragon Ball DLE</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="stars"></div>
  <div class="dragon-balls-bg">
    <div class="db db1">★</div>
    <div class="db db2">★★</div>
    <div class="db db3">★★★</div>
    <div class="db db4">★★★★</div>
    <div class="db db5">★★★★★</div>
    <div class="db db6">★★★★★★</div>
    <div class="db db7">★★★★★★★</div>
  </div>

  <header>
    <div class="logo-wrap">
      <span class="logo-dragon">🐉</span>
      <h1>Dragon Ball <span class="dle">DLE</span></h1>
    </div>
    <p class="subtitle">Devine le personnage mystère !</p>
    <div class="tries-counter">
      Essais : <span id="tries">0</span>
    </div>
  </header>

  <main>
    <div class="search-wrap">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Tape un nom de personnage..." autocomplete="off" />
        <div id="suggestions" class="suggestions hidden"></div>
      </div>
      <button id="guess-btn">Deviner</button>
    </div>

    <div id="error-msg" class="error-msg hidden"></div>

    <div id="columns-header" class="columns-header hidden">
      <div class="col-label">Personnage</div>
      <div class="col-label">Sexe</div>
      <div class="col-label">Race</div>
      <div class="col-label">Affiliation</div>
      <div class="col-label">Cheveux</div>
      <div class="col-label">Statut</div>
      <div class="col-label">Saga</div>
      <div class="col-label">Transformation</div>
    </div>

    <div id="guesses-container"></div>

    <div id="win-screen" class="win-screen hidden">
      <div class="win-content">
        <div class="win-aura"></div>
        <div class="win-emoji">🌟</div>
        <h2>Kamehameha !</h2>
        <p>Tu as trouvé <strong id="win-name"></strong> en <strong><span id="win-tries"></span> essai(s)</strong> !</p>
        <button id="play-again-btn">Rejouer</button>
      </div>
    </div>
  </main>

  <footer>
    <p>Fan-made — Dragon Ball © Akira Toriyama</p>
  </footer>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
